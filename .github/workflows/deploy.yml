name: Deploy to HostArmada

# Auto-deploys the site to cPanel (public_html) on every push to main.
# Requires three repo secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    e.g. lon1.hostclusters.com  (or the server IP 173.234.16.24)
#   FTP_USERNAME  e.g. simplegeniusco  (or a dedicated FTP account)
#   FTP_PASSWORD  the matching password

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Assumes a dedicated FTP account whose directory IS public_html,
          # so files upload to its root. If you instead use the MAIN cPanel
          # account (root = home dir), change this line to: public_html/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .cpanel.yml
            .gitignore
            brain.json
